<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f1e7db">
<!-- VERSION 2026-09-16d -->
<title>夜跑紀錄</title>
<style>
:root{
  color-scheme:light only;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1e7db; --card:#faf5ee; --ink:#3d2f26; --mute:#9a8676; --line:#e2d4c3;
  --acc:#a8703f; --acc-ink:#fff8ef; --cell:#e6d9c8; --cell-run:#b9834f; --cell-run-ink:#fff8ef;
  --lock:#bfae9c;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:32px;line-height:1.1;font-weight:700}
h2{margin:0 0 10px;font-size:15px;font-weight:500;color:var(--mute);letter-spacing:.08em}

.go{width:100%;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:700 28px/1 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:26px 16px;cursor:pointer}
.go:active{transform:scale(.985)}
.go.done{background:var(--card);color:var(--ink);border:2px solid var(--acc)}
.off{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:500 19px/1 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:18px 16px;cursor:pointer}
.off:active{transform:scale(.985)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:15px;color:var(--mute);margin-left:2px}
.stat span{font-size:13px;color:var(--mute)}

.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dn{text-align:center;font-size:12px;color:var(--mute);margin-bottom:-2px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--cell);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mute);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cell.run{background:var(--cell-run);color:var(--cell-run-ink);font-weight:700}
.cell.today{border-color:var(--acc);border-style:dashed}
.cell.today.run{border-style:solid}
.cell.future{background:transparent;border-color:var(--line);color:transparent;cursor:default}
.cell.pre{background:transparent;border-color:var(--line);color:transparent;cursor:default}

.night{display:flex;flex-direction:column;gap:12px}
.nights{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.nt{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink)}
.nt .d{font-size:12px;color:var(--mute)}
.nt .t{width:100%;border-radius:9px;background:var(--cell);padding:9px 0;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:1px solid transparent}
.nt .t.has{background:var(--card);border-color:var(--line)}
.nt.today .t{border:1px dashed var(--acc)}

.step{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding-block:12px;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step .when{font-size:17px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.step .what{font-size:17px;font-weight:500}
.step.locked .when,.step.locked .what{color:var(--lock)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.go:active,.off:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>夜跑紀錄</h1>

  <button class="go" id="go" type="button">今天跑了</button>

  <div class="stats">
    <div class="stat"><b id="sWeek">0<em>/2</em></b><span>這週</span></div>
    <div class="stat"><b id="sTotal">0</b><span>總共</span></div>
    <div class="stat"><b id="sLast">—</b><span>上次跑</span></div>
  </div>

  <section>
    <h2>最近四週</h2>
    <div class="wk" id="dn"></div>
    <div class="wk" id="grid" style="margin-top:7px"></div>
  </section>

  <section class="night">
    <h2>晚上</h2>
    <button class="off" id="off" type="button">手機放客廳了</button>
    <div class="nights" id="nights"></div>
  </section>

  <section>
    <h2>接下來</h2>
    <div class="step"><div class="when">現在</div><div class="what">跑步</div></div>
    <div class="step"><div class="when">現在</div><div class="what">自由書寫</div></div>
    <div class="step locked"><div class="when">10/13</div><div class="what">閱讀</div></div>
  </section>
</div>

<script>
(function(){
  var VERSION='2026-09-16d';
  var KEY='run_log_v1';
  var START='2026-09-16';
  var state={days:{},nights:{}};
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.days){ state=o; if(!state.nights) state.nights={}; } } }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return ymd(new Date()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
  function dow(s){ return (parse(s).getDay()+6)%7; }
  function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
  function nightKey(){ var d=new Date(); var k=ymd(d); return d.getHours()<12 ? addDays(k,-1) : k; }
  function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }

  var go=document.getElementById('go');
  var off=document.getElementById('off');
  var grid=document.getElementById('grid');
  var nights=document.getElementById('nights');
  var dn=document.getElementById('dn');
  ['一','二','三','四','五','六','日'].forEach(function(n){ var e=document.createElement('div'); e.className='dn'; e.textContent=n; dn.appendChild(e); });

  function toggle(d){ if(state.days[d]) delete state.days[d]; else state.days[d]=1; save(); render(); }
  go.addEventListener('click',function(){ toggle(today()); });
  off.addEventListener('click',function(){ state.nights[nightKey()]=hhmm(new Date()); save(); render(); });

  function editNight(d){
    var cur=state.nights[d]||'';
    var v=prompt('那天晚上手機放客廳的時間（例如 00:15），清空就是刪掉',cur);
    if(v===null) return;
    v=v.trim();
    if(!v){ delete state.nights[d]; save(); render(); return; }
    var m=v.match(/^(\d{1,2})[:：.]?(\d{2})$/);
    if(!m){ alert('看不懂這個時間，用 00:15 這種寫法'); return; }
    state.nights[d]=pad(+m[1]%24)+':'+m[2];
    save(); render();
  }

  function render(){
    var t=today();
    var ran=!!state.days[t];
    go.className='go'+(ran?' done':'');
    go.textContent=ran?'今天跑了 ✓':'今天跑了';

    var monday=addDays(t,-dow(t));
    var week=0; for(var i=0;i<7;i++){ if(state.days[addDays(monday,i)]) week++; }
    var total=0, last=null;
    Object.keys(state.days).forEach(function(d){ if(d<=t){ total++; if(!last||d>last) last=d; } });
    document.getElementById('sWeek').innerHTML=week+'<em>/2</em>';
    document.getElementById('sTotal').textContent=total;
    var sl=document.getElementById('sLast');
    if(!last) sl.textContent='—';
    else { var n=diffDays(last,t); sl.innerHTML=n===0?'今天':(n+'<em>天前</em>'); }

    grid.innerHTML='';
    var first=addDays(monday,-21);
    for(var k=0;k<28;k++){
      var d=addDays(first,k);
      var b=document.createElement('button'); b.type='button'; b.className='cell';
      b.textContent=+d.slice(8);
      if(d>t){ b.classList.add('future'); b.disabled=true; }
      else if(d<START){ b.classList.add('pre'); b.disabled=true; }
      else {
        if(state.days[d]) b.classList.add('run');
        if(d===t) b.classList.add('today');
        (function(dd){ b.addEventListener('click',function(){ toggle(dd); }); })(d);
      }
      grid.appendChild(b);
    }

    nights.innerHTML='';
    var nk=nightKey();
    for(var j=6;j>=0;j--){
      var d2=addDays(nk,-j);
      var v=state.nights[d2];
      var nb=document.createElement('button'); nb.type='button'; nb.className='nt'+(d2===nk?' today':'');
      nb.innerHTML='<span class="d">'+(+d2.slice(8))+'</span><span class="t'+(v?' has':'')+'">'+(v||'—')+'</span>';
      (function(dd){ nb.addEventListener('click',function(){ editNight(dd); }); })(d2);
      nights.appendChild(nb);
    }
  }
  render();
})();
</script>
</body>
</html>
