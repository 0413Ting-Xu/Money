<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#163d9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="對帳">
<!-- VERSION 2026-09-27g -->
<title>對帳</title>
<style>
:root{
  color-scheme:light only;
  --bg:#f5f7fc; --card:#fff; --ink:#1c2b48; --mute:#64718a; --line:#e0e6f0;
  --navy:#163d9a; --blue:#214cc5; --soft:#eaf0fe;
  --ok:#1f7a4d; --ok-bg:#e5f4ec; --bad:#a83042; --bad-bg:#fdecee;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 22px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:700}
.float{display:block;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;gap:24px}

.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--mute);font-weight:500}
input[type=text],input[type=number],input:not([type]){width:100%;border:2px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:22px;font-weight:600;color:var(--ink);outline:none;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--blue)}
input.note{font-size:18px;font-weight:400}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names button{border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 20px;font-size:18px;min-width:64px}
.names button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.expect{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-size:16px}
.expect b{color:var(--ink);font-size:24px;font-variant-numeric:tabular-nums}
.go{width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:19px;font-weight:700;padding:12px 16px}
.go:disabled{background:#b8c4dc}
.go:active:not(:disabled){transform:scale(.985)}

.result{border-radius:14px;padding:12px 16px;text-align:center;font-weight:700}
.result .big{font-size:24px;line-height:1.3}
.result .sub{font-size:14px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.bad{background:var(--bad-bg);color:var(--bad)}

.day{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day h2{margin:0;font-size:19px;font-weight:700}
.day button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:40px;font-size:20px;color:var(--blue)}
.day button:disabled{color:#c5cddd}
.list{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;width:100%;text-align:left}
.rec.bad{border-left-color:var(--bad)}
.rec .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .who{font-size:16px}
.rec .r{font-size:19px;font-weight:700;text-align:right;white-space:nowrap}
.rec.ok .r{color:var(--ok)} .rec.bad .r{color:var(--bad)}
.rec .nums{grid-column:1/-1;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.rec .nt{grid-column:1/-1;font-size:15px;color:var(--ink);background:var(--soft);border-radius:8px;padding:4px 10px;margin-top:4px}
.empty{color:var(--mute);text-align:center;padding:18px 0}

.sheet{position:fixed;inset:0;background:rgba(22,44,97,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:20px}
.row{display:flex;gap:10px}
.row button{flex:1;border-radius:12px;padding:14px;font-size:18px;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
.row .save{background:var(--blue);border-color:var(--blue);color:#fff}
.row .del{color:var(--bad);flex:0 0 auto}
.row .del.armed{background:var(--bad);border-color:var(--bad);color:#fff}
input.miss{border-color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>對帳</h1>
</div></header>

<main class="wrap">
  <section class="form">
    <label>清點人
      <input id="who" type="text" autocomplete="off">
      <div class="names" id="names"></div>
    </label>
    <div class="two">
      <label>系統營業額<input id="sales" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label>
      <label>錢櫃實點<input id="cash" inputmode="numeric" pattern="[0-9]*" autocomplete="off"></label>
    </div>
    <label>備註<input id="note" class="note" type="text" autocomplete="off"></label>
    <div class="expect"><div>錢櫃應有<span class="float">零用金 10,000</span></div><b id="expect">—</b></div>
    <button class="go" id="go" disabled>儲存</button>
  </section>

  <section id="result" hidden></section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="day">
      <button id="prev" aria-label="前一天">‹</button>
      <h2 id="dayTitle"></h2>
      <button id="next" aria-label="後一天">›</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3 id="editTitle"></h3>
    <div class="two">
      <label>系統營業額<input id="eSales" inputmode="numeric" pattern="[0-9]*"></label>
      <label>錢櫃實點<input id="eCash" inputmode="numeric" pattern="[0-9]*"></label>
    </div>
    <label>備註<input id="eNote" class="note" type="text"></label>
    <div class="row">
      <button class="del" id="eDel">刪除</button>
      <button id="eCancel">取消</button>
      <button class="save" id="eSave">儲存</button>
    </div>
  </div>
</div>

<script>
const KEY = "deyiji-cash-v1";
const FLOAT = 10000;
let state = { records: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.records)) state = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert("存不進去，請確認 Safari 沒有開私密瀏覽"); } }

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
const num = v => { const s = String(v).replace(/[^0-9]/g, ""); return s === "" ? null : Number(s); };
let viewDay = todayKey();
let editing = null;

function judge(r) {
  const expect = FLOAT + r.sales, diff = r.cash - expect;
  const ok = diff === 0 || (r.note || "").trim() !== "";
  const gap = (diff < 0 ? "少 " : "多 ") + fmt(Math.abs(diff));
  const text = diff === 0 ? "✅" : ok ? gap + " 已備註" : "❌ " + gap;
  return { expect, diff, ok, text };
}

const NAMES = ["Hung", "Xu", "qing", "🦢"];
function renderNames() {
  $("names").innerHTML = "";
  NAMES.forEach(w => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = w;
    if ($("who").value.trim() === w) b.className = "on";
    b.onclick = () => { $("who").value = w; renderNames(); check(); };
    $("names").appendChild(b);
  });
}

function check() {
  const s = num($("sales").value), c = num($("cash").value);
  $("expect").textContent = s === null ? "—" : fmt(FLOAT + s);
  $("go").disabled = !($("who").value.trim() && s !== null && c !== null);
}

function renderDay() {
  const [y, m, d] = viewDay.split("-").map(Number);
  const wd = "日一二三四五六"[new Date(y, m - 1, d).getDay()];
  $("dayTitle").textContent = (viewDay === todayKey() ? "今天 " : "") + `${m}/${d}（${wd}）`;
  const days = [...new Set(state.records.map(r => r.day))].sort();
  $("prev").disabled = !days.some(k => k < viewDay);
  $("next").disabled = viewDay >= todayKey();
  const recs = state.records.filter(r => r.day === viewDay).sort((a, b) => a.time.localeCompare(b.time));
  const list = $("list"); list.innerHTML = "";
  if (!recs.length) { list.innerHTML = '<div class="empty">這天還沒有清點</div>'; return; }
  recs.forEach(r => {
    const j = judge(r);
    const b = document.createElement("button"); b.type = "button";
    b.className = "rec " + (j.ok ? "ok" : "bad");
    b.innerHTML = `<span class="t">${r.time}</span><span class="who"></span><span class="r">${j.text}</span>
      <span class="nums">營業額 ${fmt(r.sales)}　應有 ${fmt(j.expect)}　實點 ${fmt(r.cash)}</span>`;
    b.querySelector(".who").textContent = r.who;
    if (r.note) { const n = document.createElement("span"); n.className = "nt"; n.textContent = r.note; b.appendChild(n); }
    b.onclick = () => openEdit(r);
    list.appendChild(b);
  });
}

function showResult(r) {
  const j = judge(r), el = $("result");
  el.hidden = false; el.className = "result " + (j.ok ? "ok" : "bad");
  el.innerHTML = `<div class="big">${j.text}</div><div class="sub">應有 ${fmt(j.expect)}　實點 ${fmt(r.cash)}</div>`;
}

$("go").onclick = () => {
  const now = new Date();
  const r = { id: now.getTime(), day: dayKey(now), time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    who: $("who").value.trim(), float: FLOAT, sales: num($("sales").value), cash: num($("cash").value),
    note: $("note").value.trim() };
  state.records.push(r); save();
  $("sales").value = ""; $("cash").value = ""; $("note").value = "";
  viewDay = r.day; showResult(r); renderNames(); renderDay(); check();
  document.activeElement && document.activeElement.blur();
};

function openEdit(r) {
  editing = r;
  $("editTitle").textContent = `${r.time}　${r.who}`;
  $("eSales").value = r.sales; $("eCash").value = r.cash; $("eNote").value = r.note || "";
  $("eSales").classList.remove("miss"); $("eCash").classList.remove("miss");
  $("eDel").textContent = "刪除"; $("eDel").classList.remove("armed");
  $("sheet").classList.add("show");
}
function closeEdit() { editing = null; $("sheet").classList.remove("show"); }
$("eCancel").onclick = closeEdit;
$("sheet").onclick = e => { if (e.target === $("sheet")) closeEdit(); };
$("eSave").onclick = () => {
  const s = num($("eSales").value), c = num($("eCash").value);
  $("eSales").classList.toggle("miss", s === null); $("eCash").classList.toggle("miss", c === null);
  if (s === null || c === null) return;
  editing.sales = s; editing.cash = c; editing.note = $("eNote").value.trim();
  save(); $("result").hidden = true; closeEdit(); renderDay();
};
$("eDel").onclick = () => {
  if (!$("eDel").classList.contains("armed")) { $("eDel").classList.add("armed"); $("eDel").textContent = "確定刪除"; return; }
  state.records = state.records.filter(x => x !== editing);
  save(); $("result").hidden = true; closeEdit(); renderNames(); renderDay();
};

$("prev").onclick = () => {
  const earlier = [...new Set(state.records.map(r => r.day))].filter(k => k < viewDay).sort();
  if (earlier.length) { viewDay = earlier[earlier.length - 1]; $("result").hidden = true; renderDay(); }
};
$("next").onclick = () => {
  const later = [...new Set(state.records.map(r => r.day))].filter(k => k > viewDay).sort();
  viewDay = later.length ? later[0] : todayKey(); $("result").hidden = true; renderDay();
};
["who", "sales", "cash"].forEach(id => $(id).addEventListener("input", () => { if (id === "who") renderNames(); check(); }));
let shownToday = todayKey();
function toToday() { shownToday = todayKey(); viewDay = shownToday; $("result").hidden = true; renderDay(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) toToday(); });
setInterval(() => { if (todayKey() !== shownToday) toToday(); }, 30000);

renderNames(); renderDay(); check();
</script>
</body>
</html>
